
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Data Form</title>
</head>
<body>

    <h1>My Bio Data</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName"
                   placeholder="First name" required><br><br>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName"
                   placeholder="Last name" required><br><br>

            Gender:
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="others" name="gender" value="Others">
            <label for="others">Others</label><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Email" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Phone number"
                   pattern="[0-9]{10}"><br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Education</legend>

            <label for="school">School Name:</label>
            <input type="text" id="school" name="school"
                   placeholder="School name"><br><br>

            <label for="class">Class:</label>
            <input type="text" id="class" name="class"
                   placeholder="Enter Class"><br><br>

            <label for="stream">Stream:</label>
            <select name="stream" id="stream">
                <option value="Science">Science</option>
                <option value="Commerce">Commerce</option>
                <option value="Arts">Arts</option>
            </select><br><br>

            <label for="marksheet">Marksheet:</label>
            <input type="file" id="marksheet" name="marksheet"
                   accept=".pdf,.jpg,.jpeg,.png"><br><br>

        </fieldset>

        <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
